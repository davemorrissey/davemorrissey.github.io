<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 3px;
    background: #111;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 2px;
  }
  .photo {
    --ar: 1.5;
    position: relative;
    margin: 0;
    flex-grow: calc(var(--ar) * 100);
    flex-basis: calc(var(--ar) * 18vw);
    aspect-ratio: var(--ar);
    overflow: hidden;
  }

  .photo img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .photo figcaption {
    position: absolute;
    left: 10px;
    bottom: 8px;
    right: 10px;
    color: #fff;
    font-size: 0.85rem;
    text-shadow: 0 2px 5px #000, 0 1px 2px #000;
    pointer-events: none;
    font-family: 'Roboto Slab', sans-serif;
    font-weight: bold;
    opacity: 0.8;
  }
  .gallery::after {
    content: "";
    flex-grow: 999999;
  }
  @media (max-width: 600px) {
    .photo {
      flex: 1 1 100%;
    }
  }
</style>
